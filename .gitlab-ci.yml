# Runs on every push and merge request. `main` should be protected so merges need a green pipeline.
# A `v*` tag also packages the app and makes a GitLab release (#61).
image: eclipse-temurin:21-jdk

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

cache:
  key:
    files:
      - gradle/wrapper/gradle-wrapper.properties
      - build.gradle
  paths:
    - .gradle/caches/
    - .gradle/wrapper/

# A newer push cancels a superseded pipeline (with "Auto-cancel redundant pipelines" on in the project settings).
default:
  interruptible: true

stages:
  - build
  - test
  - package
  - release

build:
  stage: build
  script:
    - ./gradlew assemble --console=plain

test:
  stage: test
  script:
    - ./gradlew test --console=plain
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - build/reports/tests/test/   # HTML report with the full output of each test
    reports:
      junit: build/test-results/test/TEST-*.xml

# The tests on Windows (#77, #78), on GitLab's hosted Windows runner. It uses CI minutes faster, so it runs by hand in
# branch pipelines (a merge request shows its branch's pipeline: start it there before merging Windows-related work)
# and by itself on `v*` tags. This project has no merge-request pipelines (no `workflow:` rules); a
# merge_request_event rule here would add one holding only this optional job, which would count as passed.
test-windows:
  stage: test
  tags:
    - saas-windows-medium-amd64
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
  variables:
    # The runner's clone failed with "Unable to persist credentials with the 'wincredman' credential store": the
    # image's Git Credential Manager can't use Windows' credential store in this non-interactive session. A plain
    # file store works there; the VM is thrown away after the job and the job token expires with it. (An empty
    # credential.helper through GIT_CONFIG_* doesn't work: Windows drops empty variables.)
    GCM_CREDENTIAL_STORE: plaintext
  cache:
    key:
      prefix: windows
      files:
        - gradle/wrapper/gradle-wrapper.properties
        - build.gradle
    paths:
      - .gradle/caches/
      - .gradle/wrapper/
  before_script:
    # The runner's own Java, for the spike's record; through cmd, so its stderr doesn't stop PowerShell.
    - cmd /c "java -version 2>&1"; Write-Host "runner Java exit code $LASTEXITCODE"
    - choco install temurin21 -y --no-progress --limit-output
    - $env:JAVA_HOME = (Get-ChildItem "C:\Program Files\Eclipse Adoptium" -Directory -Filter "jdk-21*" | Select-Object -First 1).FullName
    - $env:Path = "$env:JAVA_HOME\bin;$env:Path"
    - cmd /c "java -version 2>&1"
  script:
    - .\gradlew.bat test --console=plain
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - build/reports/tests/test/
    reports:
      junit: build/test-results/test/TEST-*.xml

# The Linux release archive (#61): build/release/linview-<version>-linux-x64.tar.gz, the app image with its own Java
# runtime (Temurin bundles its native libraries), the .desktop file, icons and install.sh. On a `v*` tag it must match
# `version` in build.gradle and goes to the package registry; on a branch it can be started by hand to try it.
package:
  stage: package
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
  script:
    - VERSION=$(sed -n "s/^version = '\(.*\)'$/\1/p" build.gradle)
    - |
      if [ -n "$CI_COMMIT_TAG" ] && [ "$CI_COMMIT_TAG" != "v$VERSION" ]; then
        echo "Tag $CI_COMMIT_TAG doesn't match version $VERSION in build.gradle"
        exit 1
      fi
    - ./gradlew releaseArchive --console=plain
    - FILE=linview-$VERSION-linux-x64.tar.gz
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        command -v curl >/dev/null || { apt-get update -qq && apt-get install -y -qq curl >/dev/null; }
        curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "build/release/$FILE" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/linview/$VERSION/$FILE"
      fi
    - echo "VERSION=$VERSION" > release.env
  artifacts:
    expire_in: 1 week
    paths:
      - build/release/*.tar.gz
    reports:
      dotenv: release.env   # VERSION for the release job

# The GitLab release for the tag, linking the archive in the package registry. The GitHub release stays manual.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  needs:
    - job: package
      artifacts: true
  script:
    - echo "Releasing linview $VERSION"
  release:
    tag_name: $CI_COMMIT_TAG
    name: linview $VERSION
    description: "linview $VERSION for Linux (x86-64). Unpack the archive and run ./install.sh (no root needed); ./install.sh --uninstall removes it. What changed: CHANGELOG.md."
    assets:
      links:
        - name: linview-$VERSION-linux-x64.tar.gz
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/linview/$VERSION/linview-$VERSION-linux-x64.tar.gz
          link_type: package
