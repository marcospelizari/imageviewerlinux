# Runs on every push and merge request. `main` should be protected so merges need a green pipeline.
# A `v*` tag also packages the app and makes a GitLab release (#61).
image: eclipse-temurin:21-jdk

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

cache:
  key:
    files:
      - gradle/wrapper/gradle-wrapper.properties
      - build.gradle
  paths:
    - .gradle/caches/
    - .gradle/wrapper/

# A newer push cancels a superseded pipeline (with "Auto-cancel redundant pipelines" on in the project settings).
default:
  interruptible: true

stages:
  - build
  - test
  - package
  - release

build:
  stage: build
  script:
    - ./gradlew assemble --console=plain

test:
  stage: test
  script:
    - ./gradlew test --console=plain
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - build/reports/tests/test/   # HTML report with the full output of each test
    reports:
      junit: build/test-results/test/TEST-*.xml

# The Linux release archive (#61): build/release/linview-<version>-linux-x64.tar.gz, the app image with its own Java
# runtime (Temurin bundles its native libraries), the .desktop file, icons and install.sh. On a `v*` tag it must match
# `version` in build.gradle and goes to the package registry; on a branch it can be started by hand to try it.
package:
  stage: package
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
  script:
    - VERSION=$(sed -n "s/^version = '\(.*\)'$/\1/p" build.gradle)
    - |
      if [ -n "$CI_COMMIT_TAG" ] && [ "$CI_COMMIT_TAG" != "v$VERSION" ]; then
        echo "Tag $CI_COMMIT_TAG doesn't match version $VERSION in build.gradle"
        exit 1
      fi
    - ./gradlew releaseArchive --console=plain
    - FILE=linview-$VERSION-linux-x64.tar.gz
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        command -v curl >/dev/null || { apt-get update -qq && apt-get install -y -qq curl >/dev/null; }
        curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "build/release/$FILE" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/linview/$VERSION/$FILE"
      fi
    - echo "VERSION=$VERSION" > release.env
  artifacts:
    expire_in: 1 week
    paths:
      - build/release/*.tar.gz
    reports:
      dotenv: release.env   # VERSION for the release job

# The GitLab release for the tag, linking the archive in the package registry. The GitHub release stays manual.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  needs:
    - job: package
      artifacts: true
  script:
    - echo "Releasing linview $VERSION"
  release:
    tag_name: $CI_COMMIT_TAG
    name: linview $VERSION
    description: "linview $VERSION for Linux (x86-64). Unpack the archive and run ./install.sh (no root needed); ./install.sh --uninstall removes it. What changed: CHANGELOG.md."
    assets:
      links:
        - name: linview-$VERSION-linux-x64.tar.gz
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/linview/$VERSION/linview-$VERSION-linux-x64.tar.gz
          link_type: package
